<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Researcher RAG</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
        .user { align-self: flex-end; background: #007aff; color: white; }
        .bot { align-self: flex-start; background: white; border: 1px solid #ddd; white-space: pre-wrap; }
        #input-area { padding: 20px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #007aff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .bot hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
        .bot small { color: #888; font-size: 0.85em; }
        #spinner {
            display: none; /* По умолчанию скрыт */
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 122, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007aff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Стиль для статус-бара рядом со спиннером */
        #status-msg {
            font-size: 0.85em;
            color: #888;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="input-area">
        <select id="level" style="padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
            <option value="LLM set">LLM (Strict)</option>
            <option value="NLP set">NLP</option>
            <option value="DL set">Deep Learning</option>
            <option value="ML set">Machine Learning</option>
            <option value="AI set">Artificial Intelligence (Broad)</option>
        </select>
        <input type="text" id="query" placeholder="Ask your books...">
        <button onclick="ask()">Send</button>
        <div id="spinner"></div>
        <span id="status-msg"></span>
        <button onclick="clearChat()" style="background: #ff3b30;">Clear</button>
    </div>

    <script>
        async function ask() {
            const query = document.getElementById('query').value;
            const level = document.getElementById('level').value;
            const spinner = document.getElementById('spinner');
            const status = document.getElementById('status-msg');
            
            if (!query) return;

            // Включаем индикацию
            spinner.style.display = 'inline-block';
            status.innerText = 'Searching books...';

            // Add User message
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user">${query}</div>`;
            document.getElementById('query').value = '';

            // Create Bot message placeholder
            const botMsg = document.createElement('div');
            botMsg.className = 'msg bot';
            chat.appendChild(botMsg);

            // POST to FastAPI
            const response = await fetch('http://127.0.0.1:8000/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: query, level: level })
            });

            // READ THE STREAM
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let isFirstToken = true;

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                if (isFirstToken) {
                    spinner.style.display = 'none';
                    status.innerText = '';
                    isFirstToken = false;
                }

                botMsg.innerText += decoder.decode(value);
                chat.scrollTop = chat.scrollHeight; // Auto-scroll
            }
        }
        function clearChat() {
            // Просто обнуляем содержимое контейнера чата
            document.getElementById('chat').innerHTML = '';
            // И чистим статус, если он завис
            document.getElementById('status-msg').innerText = '';
        }
    </script>
</body>
</html>
